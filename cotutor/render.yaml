# Render web service 1개. SSE 상태가 메모리에 있으므로 인스턴스는 1개로 고정한다. (실제 배포는 하지 않음)
services:
  - type: web
    name: cotutor
    runtime: node
    plan: free
    numInstances: 1
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: AI_MODE
        value: replay
      - key: LLM_PROVIDER
        value: anthropic
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: MODEL_LESSON
        value: claude-sonnet-5-5
      - key: MODEL_CLUSTER
        value: claude-haiku-5-5
      - key: MODEL_JUDGE
        value: claude-opus-5-5
      - key: AI_TIMEOUT_MS
        value: "20000"
      - key: PUBLIC_BASE_URL
        sync: false
      - key: TEACHER_KEY
        sync: false
      - key: RETENTION_DAYS
        value: "7"
