<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>함께반 · 복식학급 수업 코티처</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3CclipPath id='b'%3E%3Ccircle cx='19.6' cy='14.2' r='6.6'/%3E%3C/clipPath%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='%231F3D33'/%3E%3Ccircle cx='12.4' cy='14.2' r='6.6' fill='%2372AF90' clip-path='url%28%23b%29'/%3E%3Ccircle cx='12.4' cy='14.2' r='6.6' fill='none' stroke='%2392B3D7' stroke-width='1.9'/%3E%3Ccircle cx='19.6' cy='14.2' r='6.6' fill='none' stroke='%23EDA483' stroke-width='1.9'/%3E%3Cpath d='M8.5 25.2c4.6-.9 10.4-.7 15.2-.2' fill='none' stroke='%23F2C94C' stroke-width='1.9' stroke-linecap='round'/%3E%3C/svg%3E" />
    <meta name="theme-color" content="#1F3D33" />
    <script>
      // 첫 그리기 전에 테마 결정. 기본은 밝은 화면, 토글하면 저장
      (function () {
        try { if (localStorage.getItem('cotutor-theme') === 'dark') document.documentElement.classList.add('dark'); } catch (e) {}
        // 심사 모드(?present=1 또는 저장값)도 첫 그리기 전에 켠다
        try {
          var q = new URLSearchParams(location.search).get('present');
          if (q === '1' || (q !== '0' && localStorage.getItem('cotutor-present') === '1')) document.documentElement.classList.add('present');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/teacher/main.tsx"></script>
  </body>
</html>
